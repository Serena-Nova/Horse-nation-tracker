<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Wanneer trainen — Horse Nation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body class="bg-stone-100">
<div id="root">
  <div style="font-family: -apple-system, sans-serif; padding: 24px; color: #57534e; font-size: 14px; line-height: 1.5;">
    Bezig met laden…
  </div>
</div>
<script>
  // Zelfdiagnose: als de app na een paar seconden nog niet is opgestart, toon dan
  // precies wat er niet geladen kon worden (i.p.v. gewoon een leeg wit scherm).
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && root.__mounted) return;
    var missing = [];
    if (typeof React === "undefined") missing.push("React (unpkg.com)");
    if (typeof ReactDOM === "undefined") missing.push("ReactDOM (unpkg.com)");
    if (typeof Babel === "undefined") missing.push("Babel (unpkg.com)");
    var msg = missing.length
      ? "Kon niet laden: " + missing.join(", ") + " — waarschijnlijk geblokkeerd door een " +
        "advertentie-/trackingblokkering. Zet die tijdelijk uit voor deze pagina, of open de " +
        "link in een andere browser zonder blokkering."
      : "De app laadt de benodigde bestanden wel, maar start niet op. Er zit een fout in de " +
        "code zelf.";
    root.innerHTML =
      '<div style="font-family: -apple-system, sans-serif; padding: 24px; color: #b91c1c; ' +
      'font-size: 14px; line-height: 1.6; max-width: 480px;">' +
      '<strong>⚠️ Probleem bij laden</strong><br/><br/>' + msg + '</div>';
  }, 4000);
</script>

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef } = React;

const DRESSUUR = ["BB", "B", "L1", "L2", "M1", "M2", "Z1", "Z2", "ZZ-Licht", "ZZ-Zwaar"];
const SPRINGEN = ["B", "L", "M", "Z", "ZZ"];
const WESTERN = ["L5", "L4", "L3", "L2", "L1"];

const DISCIPLINES = [
  { key: "dressuur", label: "Dressuur", levels: DRESSUUR },
  { key: "springen", label: "Springen", levels: SPRINGEN },
  { key: "reining", label: "Reining", levels: WESTERN },
  { key: "trail", label: "Trail", levels: WESTERN },
  { key: "westernPleasure", label: "Western Pleasure", levels: WESTERN },
];
const SLOT_ORDER = { springen: 1, reining: 2, trail: 3, westernPleasure: 4 };

function offsetFor(key, ronde) {
  if (key === "dressuur") return ronde <= 4 ? ronde * 25 : 125 + (ronde - 5) * 5;
  return ronde * 25 + SLOT_ORDER[key] * 5;
}
function rondeFor(key, niveau) {
  const d = DISCIPLINES.find((x) => x.key === key);
  return d.levels.indexOf(niveau);
}
function remainingMinutes(offset, nowMin) {
  return ((offset - nowMin) % 180 + 180) % 180;
}
function parseTimeToMinutes(t) {
  if (!t) return null;
  const [h, m] = t.split(":").map(Number);
  if (Number.isNaN(h) || Number.isNaN(m)) return null;
  return h * 60 + m;
}
function formatMinutes(mins) {
  if (mins < 60) return mins + "m";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h + "u" + String(m).padStart(2, "0");
}

function computeStatus(horse, key, nowMin) {
  const niveau = horse.levels[key];
  if (!niveau) return null;
  const ronde = rondeFor(key, niveau);
  if (ronde < 0) return null;
  const pctRaw = horse.pct[key];
  const pct = pctRaw === "" || pctRaw === undefined ? null : Number(pctRaw);
  const offset = offsetFor(key, ronde);
  let remaining = remainingMinutes(offset, nowMin);

  let symbol = null;
  let excluded = false;
  if (pct !== null && !Number.isNaN(pct)) {
    if (pct >= 100) {
      excluded = true;
      symbol = "done";
    } else if (pct >= 80) {
      symbol = "done";
    } else {
      const gap = 80 - pct;
      const sessionsNeeded = Math.ceil(gap / 20);
      const tijdNodig = sessionsNeeded * 2.5;
      if (remaining < 15) {
        // Deze ronde is niet meer haalbaar — kijk meteen naar de eerstvolgende ronde
        // daarna (180 min later), in plaats van een dooie "te laat"-melding te tonen.
        remaining = remaining + 180;
      }
      symbol = remaining >= tijdNodig ? "train" : "warn";
    }
  }

  const regTime = horse.registered[key];
  let regStatus = null;
  if (regTime) {
    const regMin = parseTimeToMinutes(regTime);
    if (regMin !== null) regStatus = nowMin >= regMin ? "expired" : "valid";
  }

  return { key, niveau, pct, remaining, symbol, excluded, regStatus, regTime };
}

function rankedDisciplines(horse, nowMin) {
  const all = DISCIPLINES.map((d) => computeStatus(horse, d.key, nowMin)).filter(Boolean);
  return [...all].sort((a, b) => {
    const ak = a.excluded ? a.remaining + 100000 : a.remaining;
    const bk = b.excluded ? b.remaining + 100000 : b.remaining;
    return ak - bk;
  });
}
function labelFor(key) {
  const d = DISCIPLINES.find((x) => x.key === key);
  return d ? d.label : key;
}

const STORAGE_KEY = "hn-horses-v1";
const DBX_TOKENS_KEY = "dbx_tokens";
const DBX_VERIFIER_KEY = "dbx_verifier";
const DROPBOX_APP_KEY = "dh0m0sdpfe8zf45";
const DROPBOX_FILE_PATH = "/horses.json";

// ---------- Dropbox sync (OAuth 2 PKCE — geen server, geen geheime sleutel nodig) ----------
function base64UrlEncode(buffer) {
  let str = "";
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.byteLength; i++) str += String.fromCharCode(bytes[i]);
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function generateRandomString(length) {
  const array = new Uint8Array(length);
  crypto.getRandomValues(array);
  return base64UrlEncode(array.buffer).slice(0, length);
}
async function sha256(plain) {
  const data = new TextEncoder().encode(plain);
  return crypto.subtle.digest("SHA-256", data);
}
function getRedirectUri() {
  return window.location.origin + window.location.pathname;
}
async function startDropboxAuth() {
  const verifier = generateRandomString(64);
  const challenge = base64UrlEncode(await sha256(verifier));
  localStorage.setItem(DBX_VERIFIER_KEY, verifier);
  const params = new URLSearchParams({
    client_id: DROPBOX_APP_KEY,
    response_type: "code",
    code_challenge: challenge,
    code_challenge_method: "S256",
    redirect_uri: getRedirectUri(),
    token_access_type: "offline",
  });
  window.location.href = "https://www.dropbox.com/oauth2/authorize?" + params.toString();
}
async function exchangeCodeForToken(code) {
  const verifier = localStorage.getItem(DBX_VERIFIER_KEY);
  const params = new URLSearchParams({
    code, grant_type: "authorization_code", client_id: DROPBOX_APP_KEY,
    redirect_uri: getRedirectUri(), code_verifier: verifier,
  });
  const res = await fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: params.toString(),
  });
  if (!res.ok) throw new Error("Verbinden mislukt (" + res.status + "): " + (await res.text()));
  return res.json();
}
async function refreshDropboxToken(refreshToken) {
  const params = new URLSearchParams({
    grant_type: "refresh_token", refresh_token: refreshToken, client_id: DROPBOX_APP_KEY,
  });
  const res = await fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: params.toString(),
  });
  if (!res.ok) throw new Error("Vernieuwen token mislukt (" + res.status + "): " + (await res.text()));
  return res.json();
}
function saveDbxTokens(tokenResponse, existingRefresh) {
  const stored = {
    access_token: tokenResponse.access_token,
    refresh_token: tokenResponse.refresh_token || existingRefresh,
    obtained_at: Date.now(),
    expires_in: tokenResponse.expires_in || 14400,
  };
  localStorage.setItem(DBX_TOKENS_KEY, JSON.stringify(stored));
  return stored;
}
function loadDbxTokens() {
  try {
    const raw = localStorage.getItem(DBX_TOKENS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
async function getValidAccessToken() {
  let tokens = loadDbxTokens();
  if (!tokens) return null;
  const ageSec = (Date.now() - tokens.obtained_at) / 1000;
  if (ageSec > tokens.expires_in - 120) {
    const fresh = await refreshDropboxToken(tokens.refresh_token);
    tokens = saveDbxTokens(fresh, tokens.refresh_token);
  }
  return tokens.access_token;
}
async function dbxDownload() {
  const token = await getValidAccessToken();
  if (!token) return null;
  const res = await fetch("https://content.dropboxapi.com/2/files/download", {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Dropbox-API-Arg": JSON.stringify({ path: DROPBOX_FILE_PATH }) },
  });
  if (res.status === 409) return null; // bestand bestaat nog niet — eerste keer
  if (!res.ok) throw new Error("Ophalen mislukt (" + res.status + "): " + (await res.text()));
  return JSON.parse(await res.text());
}
async function dbxUpload(data) {
  const token = await getValidAccessToken();
  if (!token) return;
  const res = await fetch("https://content.dropboxapi.com/2/files/upload", {
    method: "POST",
    headers: {
      Authorization: "Bearer " + token,
      "Content-Type": "application/octet-stream",
      "Dropbox-API-Arg": JSON.stringify({ path: DROPBOX_FILE_PATH, mode: "overwrite" }),
    },
    body: JSON.stringify(data),
  });
  if (!res.ok) throw new Error("Wegschrijven mislukt (" + res.status + "): " + (await res.text()));
}
function disconnectDropbox() {
  localStorage.removeItem(DBX_TOKENS_KEY);
  localStorage.removeItem(DBX_VERIFIER_KEY);
}

function emptyHorse() {
  return {
    id: Date.now() + Math.random(),
    name: "",
    levels: { dressuur: "", springen: "", reining: "", trail: "", westernPleasure: "" },
    pct: { dressuur: "", springen: "", reining: "", trail: "", westernPleasure: "" },
    registered: { dressuur: "", springen: "", reining: "", trail: "", westernPleasure: "" },
  };
}
function nowHHMM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function SymbolBadge({ symbol }) {
  if (symbol === "done") return <span className="text-emerald-700 font-bold" title="Voldoet al aan de 80%-eis">✓</span>;
  if (symbol === "train") return <span className="text-sky-600 font-bold" title="Nog tijd om naar 80% te trainen">⏳</span>;
  if (symbol === "warn") return <span className="text-amber-600 font-bold" title="Wordt krap">⚠</span>;
  return null;
}

function DisciplineRow({ status, levels, onLevelChange, onPctChange, onRegChange, isNext }) {
  const [regEditing, setRegEditing] = useState(false);
  if (!status) return null;
  const wrapClass = isNext
    ? "py-1.5 px-2.5 rounded-lg bg-emerald-50 border-2 border-emerald-400"
    : "py-1.5 px-2.5 rounded-lg bg-stone-50 border border-stone-200";
  const curPct = status.pct === null ? 0 : status.pct;
  const bump = (delta) => {
    const next = Math.max(0, Math.min(100, curPct + delta));
    onPctChange(String(next));
  };
  return (
    <div className={wrapClass}>
      <div className="flex items-center justify-between gap-2 mb-1.5">
        <div className="flex items-center gap-2 min-w-0">
          <span className={"font-medium text-sm truncate " + (isNext ? "text-emerald-900" : "text-stone-800")}>{labelFor(status.key)}</span>
          <span className={"text-xs whitespace-nowrap " + (isNext ? "text-emerald-700" : "text-stone-500")}>{formatMinutes(status.remaining)}</span>
        </div>
        <select value={status.niveau} onChange={(e) => onLevelChange(e.target.value)}
          className="text-xs font-semibold rounded border border-stone-300 bg-white px-1.5 py-1 shrink-0 focus:outline-none focus:ring-2 focus:ring-emerald-700">
          {levels.map((l) => <option key={l} value={l}>{l}</option>)}
        </select>
      </div>
      <div className="flex items-center gap-1.5 justify-end">
        <button onClick={() => bump(-5)} type="button"
          className="w-6 h-6 flex items-center justify-center rounded bg-white border border-stone-300 text-stone-500 text-xs font-bold active:bg-stone-100">−</button>
        <input type="number" min="0" max="100" value={status.pct === null ? "" : status.pct}
          onChange={(e) => onPctChange(e.target.value)} placeholder="—"
          className="w-12 text-center text-xs font-semibold rounded border border-stone-300 bg-white py-1 focus:outline-none focus:ring-2 focus:ring-emerald-700" />
        <button onClick={() => bump(5)} type="button"
          className="w-6 h-6 flex items-center justify-center rounded bg-white border border-stone-300 text-stone-500 text-xs font-bold active:bg-stone-100">+</button>
        <SymbolBadge symbol={status.symbol} />
        {regEditing ? (
          <div className="flex items-center gap-1">
            <input type="time" autoFocus value={status.regTime || ""}
              onChange={(e) => onRegChange(e.target.value)}
              onBlur={() => setRegEditing(false)}
              className="w-24 text-xs rounded border border-emerald-400 bg-white px-1 py-0.5 focus:outline-none" />
            <button type="button"
              onClick={() => { onRegChange(""); setRegEditing(false); }}
              className="w-6 h-6 flex items-center justify-center rounded text-stone-400 hover:text-red-600 hover:bg-red-50 text-xs"
              aria-label="Wis inschrijftijd">✕</button>
          </div>
        ) : status.regStatus === "valid" ? (
          <button type="button" onClick={() => setRegEditing(true)}
            className="text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-1 py-0.5">ing.</button>
        ) : status.regStatus === "expired" ? (
          <button type="button" onClick={() => setRegEditing(true)}
            className="text-xs font-semibold text-red-700 bg-red-50 border border-red-200 rounded px-1 py-0.5">verlopen</button>
        ) : (
          <button type="button" onClick={() => setRegEditing(true)}
            className="text-xs text-stone-400 border border-stone-300 rounded px-1 py-0.5" aria-label="Inschrijftijd toevoegen">📝</button>
        )}
      </div>
    </div>
  );
}

function LevelSelect({ value, onChange, levels }) {
  return (
    <select value={value} onChange={(e) => onChange(e.target.value)}
      className="w-full rounded-lg border border-stone-300 bg-white px-2 py-2 text-sm text-stone-800 focus:outline-none focus:ring-2 focus:ring-emerald-700">
      <option value="">—</option>
      {levels.map((l) => <option key={l} value={l}>{l}</option>)}
    </select>
  );
}

function EditHorse({ horse, onChange, onClose, onDelete }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const update = (field, key, value) => onChange(Object.assign({}, horse, { [field]: Object.assign({}, horse[field], { [key]: value }) }));
  return (
    <div className="fixed inset-0 z-30 bg-stone-900/50 flex items-end sm:items-center justify-center">
      <div className="bg-white w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl overflow-y-auto shadow-2xl" style={{ maxHeight: "92vh" }}>
        <div className="sticky top-0 bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between">
          <input value={horse.name} onChange={(e) => onChange(Object.assign({}, horse, { name: e.target.value }))}
            placeholder="Paardnaam"
            className="text-lg font-bold text-stone-900 flex-1 min-w-0 focus:outline-none border-b-2 border-transparent focus:border-emerald-700" />
          <button onClick={onClose} className="p-2 -mr-2 text-stone-500 hover:text-stone-800 text-xl leading-none" aria-label="Sluiten">✕</button>
        </div>
        <div className="p-4 space-y-3">
          {DISCIPLINES.map((d) => (
            <div key={d.key} className="border border-stone-200 rounded-xl p-3 bg-stone-50">
              <div className="font-semibold text-stone-800 text-sm mb-2">{d.label}</div>
              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="text-xs text-stone-500 block mb-1">Niveau</label>
                  <LevelSelect value={horse.levels[d.key]} onChange={(v) => update("levels", d.key, v)} levels={d.levels} />
                </div>
                <div>
                  <label className="text-xs text-stone-500 block mb-1">% getraind</label>
                  <input type="number" min="0" max="100" value={horse.pct[d.key]}
                    onChange={(e) => update("pct", d.key, e.target.value)} placeholder="—"
                    className="w-full rounded-lg border border-stone-300 bg-white px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700" />
                </div>
                <div>
                  <label className="text-xs text-stone-500 block mb-1">Ingeschr.</label>
                  <div className="flex items-center gap-1">
                    <input type="time" value={horse.registered[d.key]}
                      onChange={(e) => update("registered", d.key, e.target.value)}
                      className="w-full min-w-0 rounded-lg border border-stone-300 bg-white px-1 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700" />
                    {horse.registered[d.key] && (
                      <button type="button" onClick={() => update("registered", d.key, "")}
                        className="shrink-0 w-7 h-7 flex items-center justify-center rounded-lg text-stone-400 hover:text-red-600 hover:bg-red-50 text-sm"
                        aria-label="Wis inschrijftijd">✕</button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
        <div className="sticky bottom-0 bg-white border-t border-stone-200 px-4 py-3">
          {confirmDelete ? (
            <div className="flex items-center justify-between gap-2 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
              <span className="text-sm text-red-800">
                {horse.name || "dit paard"} definitief verwijderen? (bijv. na verkoop in het spel)
              </span>
              <div className="flex items-center gap-2 shrink-0">
                <button onClick={() => setConfirmDelete(false)}
                  className="text-xs font-semibold text-stone-600 px-2 py-1.5 rounded-lg hover:bg-stone-100">
                  Nee
                </button>
                <button onClick={onDelete}
                  className="text-xs font-semibold text-white bg-red-700 px-3 py-1.5 rounded-lg hover:bg-red-800">
                  Ja, verwijderen
                </button>
              </div>
            </div>
          ) : (
            <div className="flex items-center justify-between gap-3">
              <button onClick={() => setConfirmDelete(true)}
                className="flex items-center gap-1.5 text-red-700 text-sm font-medium px-3 py-2 rounded-lg hover:bg-red-50">
                🗑 Verwijderen
              </button>
              <button onClick={onClose}
                className="flex items-center gap-1.5 bg-emerald-800 text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-emerald-900">
                💾 Klaar
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function HorseCard({ horse, nowMin, onEdit, onChange, onMoveUp, onMoveDown, isFirst, isLast }) {
  const statuses = DISCIPLINES
    .map((d) => ({ d, s: computeStatus(horse, d.key, nowMin) }))
    .filter((x) => x.s);
  const setPct = (key, value) => {
    onChange({ ...horse, pct: { ...horse.pct, [key]: value } });
  };
  const setReg = (key, value) => {
    onChange({ ...horse, registered: { ...horse.registered, [key]: value } });
  };
  const setLevel = (key, value) => {
    onChange({ ...horse, levels: { ...horse.levels, [key]: value } });
  };
  // De ene discipline die nu écht als eerste getraind moet worden: van de disciplines die
  // nog niet op 80% zitten (dus nog training nodig hebben), degene met de kortste resterende tijd.
  const needsTraining = statuses.filter((x) => x.s.symbol === "train" || x.s.symbol === "warn");
  const nextKey = needsTraining.length
    ? needsTraining.reduce((a, b) => (a.s.remaining <= b.s.remaining ? a : b)).s.key
    : null;
  return (
    <div className="bg-white border border-stone-200 rounded-xl p-3 shadow-sm">
      <div className="flex items-center justify-between mb-2">
        <button onClick={onEdit} className="flex-1 text-left font-bold text-stone-900 flex items-center gap-2">
          {horse.name || "Naamloos paard"} <span className="text-stone-400 text-sm">✏️</span>
        </button>
        <div className="flex items-center gap-1 shrink-0">
          <button onClick={onMoveUp} disabled={isFirst}
            className={"w-7 h-7 flex items-center justify-center rounded-lg " + (isFirst ? "text-stone-200" : "text-stone-500 hover:bg-stone-100")}
            aria-label="Omhoog">▲</button>
          <button onClick={onMoveDown} disabled={isLast}
            className={"w-7 h-7 flex items-center justify-center rounded-lg " + (isLast ? "text-stone-200" : "text-stone-500 hover:bg-stone-100")}
            aria-label="Omlaag">▼</button>
        </div>
      </div>
      {statuses.length > 0 ? (
        <div className="space-y-1.5">
          {statuses.map(({ d, s }) => (
            <DisciplineRow key={s.key} status={s} levels={d.levels}
              onLevelChange={(v) => setLevel(s.key, v)}
              onPctChange={(v) => setPct(s.key, v)}
              onRegChange={(v) => setReg(s.key, v)} isNext={s.key === nextKey} />
          ))}
        </div>
      ) : (
        <button onClick={onEdit} className="text-sm text-stone-400 italic block w-full text-left">
          Nog geen niveaus ingevuld — tik om te bewerken
        </button>
      )}
    </div>
  );
}

function HelpInfo({ onClose }) {
  return (
    <div className="fixed inset-0 z-40 bg-stone-900/50 flex items-end sm:items-center justify-center">
      <div className="bg-white w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl overflow-y-auto shadow-2xl" style={{ maxHeight: "92vh" }}>
        <div className="sticky top-0 bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between">
          <span className="text-lg font-bold text-stone-900">Hoe werkt dit?</span>
          <button onClick={onClose} className="p-2 -mr-2 text-stone-500 hover:text-stone-800 text-xl leading-none" aria-label="Sluiten">✕</button>
        </div>
        <div className="p-4 space-y-5 text-sm text-stone-700">
          <div>
            <h3 className="font-bold text-stone-900 mb-1.5">🐴 Een paard toevoegen</h3>
            <p>Tik rechtsonder op de groene <strong>+</strong>-knop. Vul een naam in, en per discipline
              het niveau (bijv. "L4"), het percentage getraind, en eventueel wanneer je al bent
              ingeschreven. Je kunt dit later altijd aanpassen.</p>
          </div>
          <div>
            <h3 className="font-bold text-stone-900 mb-1.5">✏️ Snel aanpassen</h3>
            <p>Op elke kaart kun je direct — zonder iets te hoeven openen — het <strong>niveau</strong> wijzigen
              (het keuzevakje), het <strong>percentage</strong> bijstellen (met −/+ of door het getal te
              typen), en de <strong>inschrijftijd</strong> instellen (tik op 📝). Alleen voor de naam of
              om een paard te verwijderen open je de kaart via het potloodje.</p>
          </div>
          <div>
            <h3 className="font-bold text-stone-900 mb-1.5">Wat betekenen de icoontjes?</h3>
            <ul className="space-y-1.5">
              <li><span className="text-emerald-700 font-bold">✓</span> — Dit paard zit al op 80% of hoger voor
                deze discipline: voldoet aan de eis om mee te mogen doen.</li>
              <li><span className="text-sky-600 font-bold">⏳</span> — Nog onder de 80%, maar er is genoeg tijd
                om er nog te komen vóór de eerstvolgende wedstrijd. Dit is de "nu trainen"-melding.</li>
              <li><span className="text-amber-600 font-bold">⚠</span> — Wordt krap: waarschijnlijk net niet
                genoeg tijd meer om op 80% te komen.</li>
              <li><span className="font-semibold text-emerald-700">ing.</span> — Je hebt al ingeschreven en die
                inschrijving is nog geldig.</li>
              <li><span className="font-semibold text-red-700">verlopen</span> — De ingevulde inschrijftijd is
                al gepasseerd; opnieuw inschrijven in het spel en de tijd hier bijwerken.</li>
            </ul>
            <p className="mt-1.5">De regel met een <span className="text-emerald-800 font-semibold">groene rand</span> is
              steeds de ene discipline die nú het eerst getraind moet worden.</p>
          </div>
          <div>
            <h3 className="font-bold text-stone-900 mb-1.5">🕐 De klok</h3>
            <p>Loopt automatisch mee met de tijd van je toestel — je hoeft niets in te stellen. De tellers
              per discipline zijn gebaseerd op het wedstrijdschema van Horse Nation (elke discipline komt
              om de 3 uur weer aan de beurt).</p>
          </div>
          <div>
            <h3 className="font-bold text-stone-900 mb-1.5">☁️ Dropbox-synchronisatie</h3>
            <p>Verbind via "⇄ Overzetten" → Dropbox met hetzelfde Dropbox-account op al je toestellen.
              Daarna geldt:</p>
            <ul className="space-y-1 mt-1">
              <li>• Wijzigingen worden ongeveer <strong>1,5 seconde</strong> na je laatste tikje automatisch
                weggeschreven.</li>
              <li>• Een ander toestel haalt de nieuwste versie alleen op bij het <strong>openen of
                verversen</strong> van de pagina — niet continu op de achtergrond.</li>
            </ul>
            <p className="mt-1.5">Nog niet verbonden met Dropbox? Dan gebruikt de app gewoon de opslag van je
              eigen toestel, en kun je via "⇄ Overzetten" → Exporteren/Importeren handmatig gegevens
              tussen toestellen kopiëren.</p>
          </div>
        </div>
      </div>
    </div>
  );
}

function ExportImport({ horses, onImport, onClose, dbxStatus, dbxMessage, onDbxConnect, onDbxDisconnect }) {
  const [tab, setTab] = useState(dbxStatus === "connected" ? "dropbox" : "export");
  const [importText, setImportText] = useState("");
  const [copyMsg, setCopyMsg] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const exportText = JSON.stringify(horses, null, 2);

  const doCopy = () => {
    try {
      navigator.clipboard.writeText(exportText);
      setCopyMsg("Gekopieerd!");
      setTimeout(() => setCopyMsg(""), 2000);
    } catch (e) {
      setCopyMsg("Kopiëren lukte niet — selecteer de tekst handmatig.");
    }
  };

  const doImport = () => {
    try {
      const parsed = JSON.parse(importText);
      if (!Array.isArray(parsed)) throw new Error("geen lijst");
      onImport(parsed);
      setImportMsg("Geïmporteerd! Je paarden staan er nu in.");
    } catch (e) {
      setImportMsg("Kon deze tekst niet lezen — plak precies de tekst die je bij 'Exporteren' hebt gekopieerd.");
    }
  };

  return (
    <div className="fixed inset-0 z-40 bg-stone-900/50 flex items-end sm:items-center justify-center">
      <div className="bg-white w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl overflow-y-auto shadow-2xl" style={{ maxHeight: "92vh" }}>
        <div className="sticky top-0 bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between">
          <span className="text-lg font-bold text-stone-900">Gegevens overzetten</span>
          <button onClick={onClose} className="p-2 -mr-2 text-stone-500 hover:text-stone-800 text-xl leading-none" aria-label="Sluiten">✕</button>
        </div>
        <div className="flex border-b border-stone-200">
          <button onClick={() => setTab("dropbox")}
            className={"flex-1 py-2.5 text-sm font-semibold " + (tab === "dropbox" ? "text-emerald-800 border-b-2 border-emerald-800" : "text-stone-400")}>
            Dropbox
          </button>
          <button onClick={() => setTab("export")}
            className={"flex-1 py-2.5 text-sm font-semibold " + (tab === "export" ? "text-emerald-800 border-b-2 border-emerald-800" : "text-stone-400")}>
            Exporteren
          </button>
          <button onClick={() => setTab("import")}
            className={"flex-1 py-2.5 text-sm font-semibold " + (tab === "import" ? "text-emerald-800 border-b-2 border-emerald-800" : "text-stone-400")}>
            Importeren
          </button>
        </div>
        {tab === "dropbox" ? (
          <div className="p-4 space-y-3">
            {dbxStatus === "connected" ? (
              <>
                <p className="text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2">
                  ✅ Verbonden met Dropbox. Wijzigingen worden automatisch bewaard en op je andere
                  toestellen opgehaald zodra je daar ook verbindt.
                </p>
                <button onClick={onDbxDisconnect}
                  className="w-full bg-stone-100 text-stone-700 text-sm font-semibold py-2.5 rounded-lg hover:bg-stone-200">
                  Ontkoppelen
                </button>
              </>
            ) : (
              <>
                <p className="text-sm text-stone-600">
                  Verbind met Dropbox om je paarden automatisch te synchroniseren tussen al je
                  toestellen — geen kopiëren-plakken meer nodig. Doe dit op elk toestel eenmalig.
                </p>
                <button onClick={onDbxConnect}
                  className="w-full bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-lg hover:bg-blue-800">
                  🔗 Verbind met Dropbox
                </button>
              </>
            )}
            {dbxMessage && <p className="text-xs text-stone-500 text-center">{dbxMessage}</p>}
          </div>
        ) : tab === "export" ? (
          <div className="p-4 space-y-3">
            <p className="text-sm text-stone-600">
              Kopieer onderstaande tekst hier, en plak 'm bij "Importeren" in de andere versie
              van de app (bijvoorbeeld je thuisscherm-app, of andersom).
            </p>
            <textarea readOnly value={exportText} onFocus={(e) => e.target.select()}
              className="w-full h-40 rounded-lg border border-stone-300 bg-stone-50 px-2 py-2 text-xs font-mono" />
            <button onClick={doCopy} className="w-full bg-emerald-800 text-white text-sm font-semibold py-2.5 rounded-lg hover:bg-emerald-900">
              📋 Kopieer naar klembord
            </button>
            {copyMsg && <p className="text-xs text-emerald-700 text-center">{copyMsg}</p>}
          </div>
        ) : (
          <div className="p-4 space-y-3">
            <p className="text-sm text-stone-600">Plak hieronder de tekst die je bij "Exporteren" hebt gekopieerd.</p>
            <textarea value={importText} onChange={(e) => setImportText(e.target.value)}
              placeholder="Plak hier..."
              className="w-full h-40 rounded-lg border border-stone-300 bg-white px-2 py-2 text-xs font-mono" />
            <button onClick={doImport} className="w-full bg-emerald-800 text-white text-sm font-semibold py-2.5 rounded-lg hover:bg-emerald-900">
              ⬇️ Importeren
            </button>
            {importMsg && <p className="text-xs text-stone-700 text-center">{importMsg}</p>}
            <p className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-2 py-1.5">
              ⚠️ Dit vervangt alle paarden die nu in déze versie staan.
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [horses, setHorses] = useState([]);
  const [nowTime, setNowTime] = useState(nowHHMM());
  const [loaded, setLoaded] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [showTransfer, setShowTransfer] = useState(false);
  const [showHelp, setShowHelp] = useState(false);
  const [dbxStatus, setDbxStatus] = useState("idle"); // idle | connecting | connected | error
  const [dbxMessage, setDbxMessage] = useState("");
  const dbxUploadTimer = useRef(null);

  useEffect(() => {
    setNowTime(nowHHMM());
    const interval = setInterval(() => setNowTime(nowHHMM()), 15000);
    return () => clearInterval(interval);
  }, []);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setHorses(JSON.parse(raw));
    } catch (e) { /* geen data nog */ }
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(horses)); }
    catch (e) { console.error("Opslaan mislukt", e); }
  }, [horses, loaded]);

  // Dropbox: OAuth-terugkeer afhandelen, of bestaande verbinding herkennen en de nieuwste
  // gegevens ophalen.
  useEffect(() => {
    (async () => {
      const url = new URL(window.location.href);
      const code = url.searchParams.get("code");
      if (code) {
        setDbxStatus("connecting");
        setDbxMessage("Verbinden met Dropbox…");
        try {
          const tokenResp = await exchangeCodeForToken(code);
          saveDbxTokens(tokenResp);
          url.searchParams.delete("code");
          url.searchParams.delete("state");
          window.history.replaceState({}, "", url.pathname + (url.search || ""));
          setDbxStatus("connected");
          const remote = await dbxDownload();
          if (remote && Array.isArray(remote)) setHorses(remote);
          setDbxMessage("Verbonden en gesynchroniseerd.");
        } catch (e) {
          setDbxStatus("error");
          setDbxMessage("Verbinden mislukt: " + e.message);
        }
        return;
      }
      const tokens = loadDbxTokens();
      if (tokens) {
        setDbxStatus("connected");
        try {
          const remote = await dbxDownload();
          if (remote && Array.isArray(remote)) setHorses(remote);
        } catch (e) {
          setDbxMessage("Kon niet synchroniseren: " + e.message);
        }
      }
    })();
  }, []);

  // Bij elke wijziging (na een korte pauze) automatisch wegschrijven naar Dropbox.
  useEffect(() => {
    if (!loaded || dbxStatus !== "connected") return;
    if (dbxUploadTimer.current) clearTimeout(dbxUploadTimer.current);
    dbxUploadTimer.current = setTimeout(async () => {
      try {
        await dbxUpload(horses);
      } catch (e) {
        setDbxMessage("Synchroniseren mislukt: " + e.message);
      }
    }, 1500);
    return () => clearTimeout(dbxUploadTimer.current);
  }, [horses, loaded, dbxStatus]);

  const nowMin = parseTimeToMinutes(nowTime) || 0;
  const ready = horses.filter((h) => {
    const ranked = rankedDisciplines(h, nowMin);
    return ranked[0] && ranked[0].symbol === "train";
  });

  const addHorse = () => {
    const h = emptyHorse();
    setHorses((prev) => [...prev, h]);
    setEditingId(h.id);
  };
  const updateHorse = (updated) => setHorses((prev) => prev.map((h) => (h.id === updated.id ? updated : h)));
  const deleteHorse = (id) => { setHorses((prev) => prev.filter((h) => h.id !== id)); setEditingId(null); };
  const moveHorse = (id, dir) => {
    setHorses((prev) => {
      const idx = prev.findIndex((h) => h.id === id);
      const swapWith = idx + dir;
      if (idx < 0 || swapWith < 0 || swapWith >= prev.length) return prev;
      const next = prev.slice();
      const tmp = next[idx];
      next[idx] = next[swapWith];
      next[swapWith] = tmp;
      return next;
    });
  };
  const editingHorse = horses.find((h) => h.id === editingId);

  if (!loaded) {
    return <div className="min-h-screen bg-stone-100 flex items-center justify-center text-stone-500 text-sm">Laden…</div>;
  }

  return (
    <div className="min-h-screen bg-stone-100 pb-24">
      <div className="bg-emerald-800 text-white px-4 pt-6 pb-5 rounded-b-3xl shadow-md">
        <div className="flex items-center justify-between mb-3 gap-2">
          <h1 className="text-xl font-bold flex-1 min-w-0">🐴 Wanneer trainen</h1>
          <button onClick={() => setShowHelp(true)}
            className="w-8 h-8 shrink-0 flex items-center justify-center text-sm font-bold bg-white/15 hover:bg-white/25 rounded-lg"
            aria-label="Hoe werkt dit?">❓</button>
          <button onClick={() => setShowTransfer(true)}
            className="text-xs font-semibold bg-white/15 hover:bg-white/25 rounded-lg px-2.5 py-1.5 flex items-center gap-1.5 shrink-0">
            {dbxStatus === "connected" && <span className="w-1.5 h-1.5 rounded-full bg-emerald-300"></span>}
            ⇄ Overzetten
          </button>
        </div>
        <div className="flex items-center gap-2 bg-emerald-900/40 rounded-xl px-3 py-2">
          <span>🕐</span>
          <span className="text-sm text-emerald-100">Huidige tijd</span>
          <span className="ml-auto bg-white text-stone-900 rounded-lg px-2.5 py-1 text-sm font-semibold tabular-nums">{nowTime}</span>
        </div>
        <div className="mt-3 flex items-start gap-2 bg-white/10 rounded-xl px-3 py-2">
          <span>👥</span>
          <div className="text-sm text-emerald-50">
            <span className="font-semibold">{ready.length} paard{ready.length === 1 ? "" : "en"}</span> klaar om nu te trainen
            {ready.length > 0 && (
              <div className="text-xs text-emerald-200 mt-0.5">{ready.map((h) => h.name || "Naamloos").join(", ")}</div>
            )}
          </div>
        </div>
      </div>

      <div className="px-4 mt-4 space-y-2.5">
        {horses.length === 0 && (
          <div className="text-center text-stone-400 text-sm py-10">Nog geen paarden. Tik hieronder op + om er een toe te voegen.</div>
        )}
        {horses.map((h, i) => (
          <HorseCard key={h.id} horse={h} nowMin={nowMin} onEdit={() => setEditingId(h.id)}
            onChange={updateHorse}
            onMoveUp={() => moveHorse(h.id, -1)} onMoveDown={() => moveHorse(h.id, 1)}
            isFirst={i === 0} isLast={i === horses.length - 1} />
        ))}
      </div>

      <button onClick={addHorse}
        className="fixed bottom-5 right-5 bg-emerald-800 text-white rounded-full w-14 h-14 shadow-lg flex items-center justify-center active:scale-95 transition-transform text-2xl"
        aria-label="Paard toevoegen">+</button>

      {editingHorse && (
        <EditHorse horse={editingHorse} onChange={updateHorse} onClose={() => setEditingId(null)} onDelete={() => deleteHorse(editingHorse.id)} />
      )}
      {showHelp && <HelpInfo onClose={() => setShowHelp(false)} />}
      {showTransfer && (
        <ExportImport horses={horses} onImport={(list) => setHorses(list)} onClose={() => setShowTransfer(false)}
          dbxStatus={dbxStatus} dbxMessage={dbxMessage}
          onDbxConnect={startDropboxAuth}
          onDbxDisconnect={() => { disconnectDropbox(); setDbxStatus("idle"); setDbxMessage(""); }} />
      )}
    </div>
  );
}

document.getElementById("root").__mounted = true;
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  // Transformeer de JSX hierboven zelf, met de klassieke (browser-veilige) instelling —
  // de standaardinstelling van recente Babel-versies genereert een import-statement dat
  // niet werkt in een gewoon scriptje zonder build-systeem.
  var source = document.getElementById("app-source").textContent;
  try {
    var compiled = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var s = document.createElement("script");
    s.textContent = compiled;
    document.body.appendChild(s);
  } catch (e) {
    document.getElementById("root").innerHTML =
      '<div style="font-family: -apple-system, sans-serif; padding: 24px; color: #b91c1c; ' +
      'font-size: 14px; line-height: 1.6;"><strong>⚠️ Fout bij het compileren</strong><br/><br/>' +
      String(e) + "</div>";
  }
</script>
</body>
</html>
